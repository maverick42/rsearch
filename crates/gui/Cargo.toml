[package]
name = "rsearch"
description = "rsearch GUI: project management, index builds and search"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rsearch-catalog = { path = "../catalog" }
rsearch-engine = { path = "../engine" }
# FemtoVG over wgpu (Direct3D/Vulkan) instead of OpenGL/glutin: a WGL
# context does not survive an RDP disconnect/reconnect and froze the UI.
# Defaults are re-listed to drop `renderer-femtovg` (OpenGL); software
# stays compiled as the last-resort fallback, never the default.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }
rfd = "0.17"

[build-dependencies]
slint-build = "1.18.1"
winres = "0.1.12"

[[bin]]
name = "rsearch"
path = "src/main.rs"
