[package]
name = "rsearch-catalog"
description = "rsearch project catalog: persistent named scan configurations and last-build summaries"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rsearch-engine = { path = "../engine" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
